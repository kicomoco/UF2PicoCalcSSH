name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  ARM_TOOLCHAIN: arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          base="$(head -n1 VERSION | tr -d '[:space:]')"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain MAJOR.MINOR, got '$base'" >&2
            exit 1
          fi
          last="$(git tag --list "v${base}.*" | sed -n "s/^v${base//./\\.}\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -n1)"
          patch=$(( ${last:--1} + 1 ))
          version="${base}.${patch}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${version}"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3-venv

      - name: Cache Arm toolchain and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/arm-toolchain
            .deps/wolfssh
            .deps/wolfssl
            .deps/pico-sdk
          key: deps-${{ env.ARM_TOOLCHAIN }}-${{ hashFiles('setup.sh') }}

      - name: Install Arm GNU Toolchain 14.2.rel1
        run: |
          if [ ! -x "$HOME/arm-toolchain/bin/arm-none-eabi-gcc" ]; then
            curl -fsSL -o /tmp/toolchain.tar.xz \
              "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/${ARM_TOOLCHAIN}.tar.xz"
            mkdir -p "$HOME/arm-toolchain"
            tar -xJf /tmp/toolchain.tar.xz -C "$HOME/arm-toolchain" --strip-components=1
          fi
          echo "$HOME/arm-toolchain/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned dependencies
        run: ./setup.sh

      - name: Run host tests
        run: |
          cmake -S tests -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure
          python3 -m venv .venv-test
          .venv-test/bin/pip install -q -r tests/requirements.txt
          .venv-test/bin/python tests/integration.py build-host/ssh_integration

      - name: Build firmware
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DAPP_VERSION="${{ steps.version.outputs.version }}"
          cmake --build build
          python3 tools/verify_uf2.py build/picocalc_ssh.uf2
          mkdir -p dist
          cp build/picocalc_ssh.uf2 "dist/picocalc_ssh-v${{ steps.version.outputs.version }}.uf2"
          (cd dist && sha256sum *.uf2 > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --target "${GITHUB_SHA}" \
            --title "PicoCalc SSH v${VERSION}" \
            --generate-notes
